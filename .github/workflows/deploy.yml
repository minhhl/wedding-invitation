name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This build only ever produces static HTML for GitHub Pages, which
      # can't run any server code at all. /api/* (including the public
      # /api/rsvp) and src/proxy.ts genuinely cannot exist in a static
      # export, so they're stripped here. /login and /guest-management are
      # KEPT — they fall back to a client-side-only, localStorage-based
      # "login" (see src/lib/staticAuth.ts) with no real data behind it,
      # since there's no backend left to call. Full functionality (real
      # login, working Guest Management/RSVP) is only ever available via
      # `npm run dev` / `npm start`.
      - name: Remove server-only routes (unsupported on static export)
        run: |
          rm -rf src/app/api
          rm -f src/proxy.ts

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /wedding-invitation
          NEXT_PUBLIC_SITE_URL: https://minhhl.github.io/wedding-invitation
          # Baked into the public JS bundle — NOT real security, just keeps
          # /login functional with no server to verify a password against.
          NEXT_PUBLIC_STATIC_AUTH_USERS: '[{"username":"minh","password":"minh","role":"admin"},{"username":"ngoc","password":"ngoc","role":"admin"}]'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
