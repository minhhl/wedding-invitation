name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This build only ever produces static HTML for GitHub Pages, which
      # can't run any server code at all. /api/* genuinely cannot exist in a
      # static export, so it's stripped here. Everything else — login, Guest
      # Management, RSVP — talks straight to Supabase from the browser (see
      # supabase/schema.sql), so it's fully functional on this build too.
      - name: Remove server-only routes (unsupported on static export)
        run: rm -rf src/app/api

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /wedding-invitation
          NEXT_PUBLIC_SITE_URL: https://minhhl.github.io/wedding-invitation
          # Anon key is public by design — RLS (supabase/schema.sql) is what
          # actually restricts what it can read/write. Set these as repo
          # secrets; see README.md "Database Setup".
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
