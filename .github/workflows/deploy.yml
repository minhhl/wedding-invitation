name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # This build only ever produces static HTML for GitHub Pages, which
      # can't run any server code. Guest Management, RSVP approval, and login
      # all need a live Node.js server (local files + session cookies), so
      # they — and every /api/* route, including the public /api/rsvp — are
      # stripped here rather than shipped broken. Full functionality is only
      # ever available via `npm run dev` / `npm start`.
      - name: Remove server-only routes (unsupported on static export)
        run: |
          rm -rf src/app/api
          rm -rf src/app/guest-management
          rm -rf src/app/login
          rm -f src/proxy.ts

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_SITE_URL: https://minhhl.github.io/wedding-invitation

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
